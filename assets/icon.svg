<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 一键多开无痕浏览器：九宫格窗口 + 中间的无痕（帽子+眼镜） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1E1B4B" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 底板（按 macOS 图标网格：824×824，四周留 100） -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>

  <!-- 周围 8 个半透明小窗口 -->
  <g fill="#FFFFFF">
    <g opacity="0.30">
      <rect x="212" y="212" width="180" height="180" rx="30"/>
      <rect x="422" y="212" width="180" height="180" rx="30"/>
      <rect x="632" y="212" width="180" height="180" rx="30"/>
      <rect x="212" y="422" width="180" height="180" rx="30"/>
      <rect x="632" y="422" width="180" height="180" rx="30"/>
      <rect x="212" y="632" width="180" height="180" rx="30"/>
      <rect x="422" y="632" width="180" height="180" rx="30"/>
      <rect x="632" y="632" width="180" height="180" rx="30"/>
    </g>
    <!-- 每个小窗口的标题栏 -->
    <g opacity="0.35">
      <rect x="236" y="234" width="132" height="18" rx="9"/>
      <rect x="446" y="234" width="132" height="18" rx="9"/>
      <rect x="656" y="234" width="132" height="18" rx="9"/>
      <rect x="236" y="444" width="132" height="18" rx="9"/>
      <rect x="656" y="444" width="132" height="18" rx="9"/>
      <rect x="236" y="654" width="132" height="18" rx="9"/>
      <rect x="446" y="654" width="132" height="18" rx="9"/>
      <rect x="656" y="654" width="132" height="18" rx="9"/>
    </g>
  </g>

  <!-- 中间高亮窗口：无痕标志 -->
  <g filter="url(#shadow)">
    <rect x="402" y="402" width="220" height="220" rx="40" fill="#FFFFFF"/>
  </g>
  <g fill="#3730A3">
    <!-- 帽子 -->
    <path d="M452 492 L472 440 Q476 430 487 433 L512 441 L537 433 Q548 430 552 440 L572 492 Z"/>
    <rect x="432" y="488" width="160" height="20" rx="10"/>
  </g>
  <!-- 眼镜 -->
  <g fill="none" stroke="#3730A3" stroke-width="13" stroke-linecap="round">
    <circle cx="474" cy="556" r="27"/>
    <circle cx="550" cy="556" r="27"/>
    <path d="M501 552 Q512 544 523 552"/>
  </g>
</svg>
