# 自动打包：
#   - 每次推送代码 / 手动点「Run workflow」：打包 Mac 版和 Windows 版，在本次运行页面底部的 Artifacts 里下载
#   - 推送 v 开头的标签（例如 v1.0.1）：另外创建 GitHub Release，并把安装包附在上面
# 第三方 Action 都固定到具体提交（commit SHA），防止标签被人改动后执行别的代码。
name: 打包

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    name: Mac 版（dmg）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # 打包不需要推送权限，不把令牌留在工作目录里
      - name: 打包
        run: bash mac/build.sh
      - name: 检查是通用版、最低 macOS 13
        run: |
          B="dist/一键多开无痕浏览器.app/Contents/MacOS/WuhenDuokai"
          lipo -archs "$B"
          for a in arm64 x86_64; do vtool -arch $a -show-build "$B" | grep -q 'minos 13.0'; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows 版（安装包 + 免安装版）
    runs-on: ubuntu-latest
    # 在 Debian 13 (trixie) 官方镜像里打包：它自带 NSIS 3.11，修复了 CVE-2025-43715（Ubuntu 24.04 只有 3.09）。
    # 镜像固定到具体摘要，防止 tag 被替换；以后要更新，到 Docker Hub 取 debian:trixie 新的摘要替换即可。
    container:
      image: debian:trixie@sha256:3cda3ca472ce45507a5109c6a3907093e24d9ae67d55954c9a07a45665dafba2
    steps:
      - name: 安装 NSIS、windres（把图标编进 exe）和打包要用的工具
        run: |
          apt-get update -q
          # windres 编译图标资源前要用 gcc 做预处理，Debian 镜像默认没有 gcc，所以一起装上
          apt-get install -y -q --no-install-recommends ca-certificates git python3 nsis binutils-mingw-w64-x86-64 gcc
      - name: 确认 NSIS 不低于 3.11
        run: |
          v="$(makensis -VERSION | sed 's/^v//')"
          echo "NSIS $v"
          [ "$(printf '%s\n%s\n' 3.11 "$v" | sort -V | head -n 1)" = 3.11 ] || { echo "NSIS 版本低于 3.11，停止打包"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # 打包不需要推送权限，不把令牌留在工作目录里
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: win/go.mod
          cache-dependency-path: win/go.sum
      - name: 代码检查
        working-directory: win
        run: GOOS=windows GOARCH=amd64 go vet .
      - name: 打包
        run: bash win/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # 打包不需要推送权限，不把令牌留在工作目录里
      - name: 检查标签和 VERSION 文件一致
        run: |
          want="v$(tr -d ' \n' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "标签是 $GITHUB_REF_NAME，但 VERSION 文件写的是 $want。请先改 VERSION 再打标签。"; exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: 生成校验文件 SHA256SUMS.txt（下载的人可以核对文件是否完整、未被改动）
        working-directory: dist
        run: |
          sha256sum -- *.dmg *.exe *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: 创建 Release 并上传安装包
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "一键多开无痕浏览器 $TAG" --generate-notes
